{{define "transition"}}
<div id="transition-result" class="transition-result"><div><span class="status-dot status-dot-lime"></span><strong>Transition complete</strong><p>Server HTML settled after the configured swap and settle timing.</p></div><button class="button button-secondary" type="button" hx-get="/demo/transition" hx-target="#transition-result" hx-swap="outerHTML transition:true swap:150ms settle:250ms">Run again</button></div>
{{end}}
