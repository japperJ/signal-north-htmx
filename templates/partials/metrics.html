{{define "metrics"}}
{{range .Telemetry}}
<article class="metric-card"><span class="metric-label">{{.Label}}</span><strong class="metric-value">{{.Value}}<small>{{.Unit}}</small></strong><span class="metric-trend">▲ stable window</span></article>
{{end}}
<article id="metric-requests" class="metric-card metric-card-accent"><span class="metric-label">HTMX requests</span><strong class="metric-value">{{.Requests}}<small>total</small></strong><span class="metric-trend">▲ server rendered</span></article>
{{end}}
